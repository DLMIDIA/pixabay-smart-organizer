<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#041410"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>

    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ab6b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-weight: 800; font-size: 15px; fill: #ffffff; }
    .node-sub { font-weight: 500; font-size: 11px; fill: #94a3b8; }
    .step-tag { font-weight: 700; font-size: 10px; fill: #ffffff; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="20" fill="url(#archBg)"/>
  <rect width="1198" height="378" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Section Title -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="font-sans" font-weight="900" font-size="22px" fill="#ffffff">FLUXO QUÂNTICO DE DADOS &amp; SINCRONIZAÇÃO</text>
    <text x="0" y="24" class="font-sans" font-size="13px" fill="#94a3b8">Do clique no Pixabay até a sincronização imediata no Google Drive sem intervenção manual</text>
  </g>

  <!-- Connective Flow Line Across All Nodes -->
  <path d="M 180 200 L 410 200 L 640 200 L 870 200 L 1050 200" stroke="url(#flowLineGrad)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- NODE 1: PIXABAY DOM -->
  <g transform="translate(60, 110)" filter="url(#nodeShadow)">
    <rect width="210" height="190" rx="14" fill="url(#boxGrad1)" stroke="#00ab6b" stroke-width="1.5"/>
    <g transform="translate(18, 18)">
      <!-- Step Badge -->
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#00ab6b"/>
      <text x="12" y="14" class="font-sans step-tag">FASE 1</text>
      <!-- Icon -->
      <circle cx="24" cy="54" r="18" fill="rgba(0, 171, 107, 0.2)"/>
      <text x="16" y="60" font-size="16px">🌐</text>
      <text x="52" y="58" class="font-sans node-title">Pixabay SPA</text>
      <text x="0" y="100" class="font-sans node-sub">• Monitora rota /search/termo</text>
      <text x="0" y="118" class="font-sans node-sub">• Lê tags e barra de busca</text>
      <text x="0" y="136" class="font-sans node-sub">• Extrai título real do card</text>
      <rect x="0" y="146" width="174" height="20" rx="4" fill="rgba(0, 171, 107, 0.15)"/>
      <text x="8" y="160" class="font-sans" font-weight="700" font-size="10px" fill="#34d399">content.js ativo</text>
    </g>
  </g>

  <!-- NODE 2: EXTENSION SERVICE WORKER -->
  <g transform="translate(295, 110)" filter="url(#nodeShadow)">
    <rect width="210" height="190" rx="14" fill="url(#boxGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#0284c7"/>
      <text x="12" y="14" class="font-sans step-tag">FASE 2</text>
      <circle cx="24" cy="54" r="18" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="16" y="60" font-size="16px">🛸</text>
      <text x="52" y="58" class="font-sans node-title">Service Worker</text>
      <text x="0" y="100" class="font-sans node-sub">• onDeterminingFilename</text>
      <text x="0" y="118" class="font-sans node-sub">• Valida CDN e referrers</text>
      <text x="0" y="136" class="font-sans node-sub">• Higieniza nomes &lt;&gt;:"/\|?*</text>
      <rect x="0" y="146" width="174" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="8" y="160" class="font-sans" font-weight="700" font-size="10px" fill="#38bdf8">background.js MV3</text>
    </g>
  </g>

  <!-- NODE 3: MACOS SYMLINK BRIDGE -->
  <g transform="translate(530, 110)" filter="url(#nodeShadow)">
    <rect width="210" height="190" rx="14" fill="url(#boxGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#9333ea"/>
      <text x="12" y="14" class="font-sans step-tag">FASE 3</text>
      <circle cx="24" cy="54" r="18" fill="rgba(168, 85, 247, 0.2)"/>
      <text x="16" y="60" font-size="16px">⚡</text>
      <text x="52" y="58" class="font-sans node-title">Ponte macOS</text>
      <text x="0" y="100" class="font-sans node-sub">• ~/Downloads/GoogleDrive</text>
      <text x="0" y="118" class="font-sans node-sub">• Redirecionamento nativo</text>
      <text x="0" y="136" class="font-sans node-sub">• Zero delay de sistema</text>
      <rect x="0" y="146" width="174" height="20" rx="4" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="8" y="160" class="font-sans" font-weight="700" font-size="10px" fill="#c084fc">Kernel Symlink Bridge</text>
    </g>
  </g>

  <!-- NODE 4: GOOGLE DRIVE CLOUD STORAGE -->
  <g transform="translate(765, 110)" filter="url(#nodeShadow)">
    <rect width="210" height="190" rx="14" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#059669"/>
      <text x="12" y="14" class="font-sans step-tag">FASE 4</text>
      <circle cx="24" cy="54" r="18" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="16" y="60" font-size="16px">☁️</text>
      <text x="52" y="58" class="font-sans node-title">Google Drive</text>
      <text x="0" y="100" class="font-sans node-sub">• 00 - DL MIDIA / Trilhas</text>
      <text x="0" y="118" class="font-sans node-sub">• Cria pasta [Categoria]</text>
      <text x="0" y="136" class="font-sans node-sub">• Sincroniza com a equipe</text>
      <rect x="0" y="146" width="174" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="8" y="160" class="font-sans" font-weight="700" font-size="10px" fill="#34d399">Nuvem Compartilhada</text>
    </g>
  </g>

  <!-- NODE 5: ORGANIZED OUTPUT (FINAL RESULT) -->
  <g transform="translate(1000, 110)" filter="url(#nodeShadow)">
    <rect width="140" height="190" rx="14" fill="#022c22" stroke="#00ab6b" stroke-width="2"/>
    <g transform="translate(16, 25)">
      <text x="35" y="20" font-size="36px">🎉</text>
      <text x="0" y="70" class="font-sans" font-weight="900" font-size="13px" fill="#ffffff" text-anchor="start">ORGANIZADO!</text>
      <text x="0" y="95" class="font-sans" font-size="11px" fill="#a7f3d0">Comercial - Track.mp3</text>
      <text x="0" y="130" class="font-sans" font-size="10px" fill="#6ee7b7">✓ Sem bagunça</text>
      <text x="0" y="145" class="font-sans" font-size="10px" fill="#6ee7b7">✓ Nome claro</text>
    </g>
  </g>
</svg>
