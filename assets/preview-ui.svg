<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="auto">
  <defs>
    <linearGradient id="prevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="neonToastGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00ab6b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .label-header { font-weight: 700; font-size: 11px; fill: #64748b; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="580" rx="20" fill="url(#prevBg)"/>
  <rect width="1198" height="578" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <g transform="translate(30, 20)">
    <circle cx="10" cy="15" r="6" fill="#ef4444"/>
    <circle cx="30" cy="15" r="6" fill="#f59e0b"/>
    <circle cx="50" cy="15" r="6" fill="#10b981"/>
    <!-- Browser URL Bar -->
    <rect x="80" y="3" width="580" height="25" rx="6" fill="#1e293b"/>
    <text x="95" y="20" class="font-sans" font-size="12px" fill="#94a3b8">🔒 https://pixabay.com/music/search/comercial/</text>
  </g>

  <!-- SECTION 1: SIMULATED PIXABAY PAGE (LEFT) -->
  <g transform="translate(30, 70)" filter="url(#boxShadow)">
    <rect width="660" height="470" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Pixabay Header Inside Mockup -->
    <rect width="660" height="55" rx="14" fill="#1e293b"/>
    <text x="25" y="35" class="font-sans" font-weight="900" font-size="22" fill="#00ab6b">pixabay</text>
    <rect x="130" y="15" width="280" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="145" y="32" class="font-sans" font-size="11px" fill="#cbd5e1">🔍 comercial</text>

    <!-- Page Title -->
    <text x="25" y="85" class="font-sans" font-weight="800" font-size="18" fill="#f8fafc">Músicas livres de direitos sobre comercial</text>
    <text x="25" y="105" class="font-sans" font-size="12px" fill="#94a3b8">Mais de 1.420 faixas encontradas para suas campanhas e vídeos</text>

    <!-- Track Row 1 -->
    <g transform="translate(25, 125)">
      <rect width="610" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="32" cy="32" r="18" fill="#00ab6b"/>
      <!-- Play Triangle -->
      <polygon points="28,24 40,32 28,40" fill="#ffffff"/>
      <text x="65" y="28" class="font-sans" font-weight="700" font-size="14px" fill="#ffffff">Upbeat Corporate Energy</text>
      <text x="65" y="47" class="font-sans" font-size="11px" fill="#94a3b8">AlexGrohl • 2:15 • 120 BPM • Pop Comercial</text>
      <!-- Waveform dummy -->
      <line x1="330" y1="32" x2="480" y2="32" stroke="#475569" stroke-width="3" stroke-dasharray="4 3"/>
      <!-- Download Button -->
      <rect x="495" y="15" width="100" height="34" rx="6" fill="#00ab6b"/>
      <text x="515" y="36" class="font-sans" font-weight="700" font-size="12px" fill="#ffffff">Baixar ▾</text>
    </g>

    <!-- Track Row 2 (Clicked Item) -->
    <g transform="translate(25, 200)">
      <rect width="610" height="65" rx="8" fill="#182234" stroke="#00ab6b" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="18" fill="#00ab6b"/>
      <polygon points="28,24 40,32 28,40" fill="#ffffff"/>
      <text x="65" y="28" class="font-sans" font-weight="700" font-size="14px" fill="#38bdf8">Energetic Indie Pop March</text>
      <text x="65" y="47" class="font-sans" font-size="11px" fill="#94a3b8">Music_Unlimited • 1:45 • Marcha / Propaganda</text>
      <line x1="330" y1="32" x2="480" y2="32" stroke="#00ab6b" stroke-width="3" stroke-dasharray="4 3"/>
      
      <!-- Clicked Download Button with Cursor -->
      <rect x="495" y="15" width="100" height="34" rx="6" fill="#007a48" stroke="#34d399" stroke-width="1.5"/>
      <text x="512" y="36" class="font-sans" font-weight="700" font-size="12px" fill="#ffffff">Baixando</text>
      
      <!-- Click cursor -->
      <g transform="translate(565, 30)">
        <polygon points="0,0 0,16 5,12 10,20 13,18 8,10 14,10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Track Row 3 -->
    <g transform="translate(25, 275)">
      <rect width="610" height="65" rx="8" fill="#1e293b" opacity="0.6"/>
      <circle cx="32" cy="32" r="18" fill="#334155"/>
      <polygon points="28,24 40,32 28,40" fill="#94a3b8"/>
      <text x="65" y="28" class="font-sans" font-weight="700" font-size="14px" fill="#cbd5e1">Podcast Modern Intro Teaser</text>
      <text x="65" y="47" class="font-sans" font-size="11px" fill="#64748b">TopAudio • 0:30 • Vinheta</text>
      <rect x="495" y="15" width="100" height="34" rx="6" fill="#334155"/>
      <text x="515" y="36" class="font-sans" font-weight="700" font-size="12px" fill="#94a3b8">Baixar ▾</text>
    </g>

    <!-- IN-PAGE FLOATING TOAST NOTIFICATION (BOTTOM RIGHT OF PAGE) -->
    <g transform="translate(180, 375)" filter="url(#neonToastGlow)">
      <rect width="455" height="75" rx="12" fill="#0b1120" stroke="#00ab6b" stroke-width="1.5"/>
      <!-- Toast Icon -->
      <rect x="15" y="15" width="45" height="45" rx="10" fill="#00ab6b"/>
      <!-- Download Arrow in toast -->
      <path d="M 37 25 L 37 42 M 30 35 L 37 43 L 44 35" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      
      <text x="72" y="33" class="font-sans" font-weight="800" font-size="13px" fill="#34d399">⚡ Pixabay Smart Organizer</text>
      <text x="72" y="52" class="font-sans" font-size="12px" fill="#f8fafc">Energetic Indie Pop March será salvo em:</text>
      <rect x="72" y="57" width="220" height="18" rx="4" fill="rgba(0, 171, 107, 0.25)"/>
      <text x="80" y="70" class="font-sans" font-weight="700" font-size="10px" fill="#a7f3d0">GoogleDrive-Pixabay/Comercial/</text>
    </g>
  </g>

  <!-- SECTION 2: CHROME EXTENSION POPUP (RIGHT) -->
  <g transform="translate(730, 45)" filter="url(#boxShadow)">
    <!-- Popup Container Body -->
    <rect width="440" height="505" rx="16" fill="#0f172a" stroke="#00ab6b" stroke-width="2"/>
    
    <!-- Header -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="rgba(0, 171, 107, 0.2)"/>
      <!-- Mini logo -->
      <path d="M 8 12 L 16 12 L 20 16 L 28 16 C 30 16 30 18 30 20 L 30 26 C 30 28 28 28 28 28 L 8 28 Z" fill="#00ab6b"/>
      <text x="46" y="20" class="font-sans" font-weight="800" font-size="16px" fill="#ffffff">Pixabay Organizer</text>
      <text x="46" y="34" class="font-sans" font-weight="700" font-size="10px" fill="#00ab6b">DOWNLOADS INTELIGENTES</text>

      <!-- Toggle On Switch -->
      <rect x="345" y="6" width="48" height="24" rx="12" fill="#00ab6b"/>
      <circle cx="379" cy="18" r="9" fill="#ffffff"/>
    </g>

    <line x1="20" y1="75" x2="420" y2="75" stroke="#334155" stroke-width="1"/>

    <!-- SECTION: PASTA DE DESTINO -->
    <g transform="translate(20, 90)">
      <text x="0" y="10" class="label-header">📁 PASTA DE DESTINO</text>
      <!-- Active input -->
      <rect x="0" y="20" width="400" height="38" rx="8" fill="#0b1120" stroke="#00ab6b" stroke-width="1.5"/>
      <text x="12" y="44" class="font-sans" font-weight="700" font-size="13px" fill="#ffffff">GoogleDrive-Pixabay</text>
      <rect x="350" y="26" width="42" height="26" rx="5" fill="#00ab6b"/>
      <text x="362" y="43" class="font-sans" font-weight="700" font-size="11px" fill="#ffffff">OK</text>

      <!-- Folder Chips -->
      <g transform="translate(0, 68)">
        <text x="0" y="12" class="font-sans" font-size="10px" fill="#64748b">Pastas Rápidas:</text>
        <g transform="translate(0, 18)">
          <rect x="0" y="0" width="125" height="24" rx="6" fill="#00ab6b"/>
          <text x="10" y="16" class="font-sans" font-weight="700" font-size="11px" fill="#ffffff">☁️ Google Drive</text>

          <rect x="132" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="142" y="16" class="font-sans" font-weight="600" font-size="11px" fill="#94a3b8">🎵 Pixabay</text>

          <rect x="223" y="0" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="233" y="16" class="font-sans" font-weight="600" font-size="11px" fill="#94a3b8">💼 Comercial</text>
        </g>
      </g>
    </g>

    <!-- SECTION: CATEGORIA ATIVA -->
    <g transform="translate(20, 225)">
      <text x="0" y="10" class="label-header">🔍 CATEGORIA / SUBCONJUNTO</text>
      <rect x="0" y="20" width="400" height="34" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="12" y="42" class="font-sans" font-size="13px" fill="#ffffff">🏷️ <tspan font-weight="800">Comercial</tspan></text>
      <text x="350" y="42" class="font-sans" font-weight="700" font-size="11px" fill="#00ab6b">Mudar</text>

      <!-- Category Chips -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="90" height="24" rx="12" fill="#00ab6b"/>
        <text x="12" y="16" class="font-sans" font-weight="700" font-size="11px" fill="#ffffff">💼 Comercial</text>

        <rect x="96" y="0" width="80" height="24" rx="12" fill="#1e293b"/>
        <text x="108" y="16" class="font-sans" font-size="11px" fill="#cbd5e1">🎺 Marcha</text>

        <rect x="182" y="0" width="80" height="24" rx="12" fill="#1e293b"/>
        <text x="194" y="16" class="font-sans" font-size="11px" fill="#cbd5e1">🎙️ Podcast</text>

        <rect x="268" y="0" width="90" height="24" rx="12" fill="#1e293b"/>
        <text x="280" y="16" class="font-sans" font-size="11px" fill="#cbd5e1">🎬 Cinema</text>
      </g>
    </g>

    <!-- SECTION: PADRÃO DE NOME -->
    <g transform="translate(20, 335)">
      <text x="0" y="10" class="label-header">FORMATO DO NOME DO ARQUIVO</text>
      <rect x="0" y="18" width="400" height="32" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="12" y="39" class="font-sans" font-size="11px" fill="#ffffff">[Categoria] - [Título].mp3 (Recomendado) ▾</text>
    </g>

    <!-- SECTION: HISTÓRICO DISCRETO -->
    <g transform="translate(20, 405)">
      <rect x="0" y="0" width="400" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="26" class="font-sans" font-weight="600" font-size="12px" fill="#94a3b8">⏱️ Último: <tspan fill="#34d399">Comercial - Energetic Indie.mp3</tspan></text>
      <text x="375" y="26" class="font-sans" font-size="13px" fill="#64748b">▾</text>
    </g>

    <!-- Bottom Button -->
    <g transform="translate(20, 460)">
      <rect x="0" y="0" width="400" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="125" y="21" class="font-sans" font-weight="700" font-size="11px" fill="#cbd5e1">📂 Abrir Pasta de Downloads</text>
    </g>
  </g>
</svg>
