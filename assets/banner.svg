<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#042018" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <radialGradient id="glowPixabay" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00ab6b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00ab6b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGoogle" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 52px; fill: url(#textGrad); letter-spacing: -1.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    .footer-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #64748b; letter-spacing: 1px; text-transform: uppercase; }
    .collab-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#glowPixabay)"/>
  <rect width="1200" height="420" fill="url(#glowGoogle)"/>

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Geometric Grid Pattern Lines -->
  <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Main Folder & Download Icon Emblem -->
  <g transform="translate(60, 65)">
    <!-- Glow behind emblem -->
    <circle cx="65" cy="65" r="75" fill="#00ab6b" opacity="0.25"/>
    <rect x="0" y="0" width="130" height="130" rx="30" fill="#0f172a" stroke="#00ab6b" stroke-width="3" filter="url(#cardShadow)"/>
    <!-- Folder Silhouette -->
    <path d="M 28 42 L 52 42 L 62 52 L 102 52 C 106 52 108 54 108 58 L 108 92 C 108 96 106 98 102 98 L 28 98 C 24 98 22 96 22 92 L 22 48 C 22 44 24 42 28 42 Z" fill="#00ab6b" opacity="0.9"/>
    <!-- Arrow Down -->
    <path d="M 65 58 L 65 80 M 55 72 L 65 82 L 75 72" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="38" r="8" fill="#38bdf8"/>
  </g>

  <!-- Header Titles -->
  <text x="220" y="105" class="title">PIXABAY SMART ORGANIZER</text>
  <text x="220" y="142" class="tagline">Roteamento Inteligente de Downloads por Busca, Categoria e Nuvem Google Drive</text>

  <!-- Feature Pills -->
  <g transform="translate(220, 168)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="195" height="32" rx="16" fill="rgba(0, 171, 107, 0.2)" stroke="#00ab6b" stroke-width="1.2"/>
    <text x="16" y="20" class="pill-text">🎯 Detecção de Busca SPA</text>

    <!-- Pill 2 -->
    <rect x="205" y="0" width="205" height="32" rx="16" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="221" y="20" class="pill-text">☁️ Google Drive Sync (Mac)</text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="185" height="32" rx="16" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="436" y="20" class="pill-text">🎵 Captura do Player DOM</text>

    <!-- Pill 4 -->
    <rect x="615" y="0" width="150" height="32" rx="16" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1.2"/>
    <text x="631" y="20" class="pill-text">⚡ Manifest V3 Puro</text>
  </g>

  <!-- Bottom Divider -->
  <line x1="60" y1="240" x2="1140" y2="240" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Sponsor & Collaborators Section -->
  <!-- Col 1: Pixabay -->
  <g transform="translate(60, 265)">
    <text x="0" y="15" class="footer-label">🌟 Patrocinador Oficial de Conteúdo</text>
    <rect x="0" y="28" width="310" height="85" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(0, 171, 107, 0.4)" stroke-width="1.5"/>
    <!-- Pixabay Logo Shape -->
    <rect x="18" y="44" width="50" height="50" rx="10" fill="#00ab6b"/>
    <text x="32" y="78" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff">P</text>
    <text x="80" y="60" class="collab-name">Pixabay.com</text>
    <text x="80" y="78" font-family="sans-serif" font-size="11px" fill="#94a3b8">Milhões de Trilhas, Áudios e Efeitos</text>
    <text x="80" y="94" font-family="sans-serif" font-size="10px" fill="#00ab6b" font-weight="600">OFFICIAL CONTENT PARTNER</text>
  </g>

  <!-- Col 2: Google & Antigravity -->
  <g transform="translate(410, 265)">
    <text x="0" y="15" class="footer-label">🚀 IA & Engenharia Colaborativa</text>
    <rect x="0" y="28" width="350" height="85" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <!-- Google Colors Icon -->
    <rect x="18" y="44" width="50" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="77" font-family="sans-serif" font-weight="900" font-size="24" fill="#38bdf8">G</text>
    <text x="80" y="60" class="collab-name">Google Antigravity &amp; DeepMind</text>
    <text x="80" y="78" font-family="sans-serif" font-size="11px" fill="#94a3b8">Arquitetura de Agentes Autônomos MV3</text>
    <text x="80" y="94" font-family="sans-serif" font-size="10px" fill="#38bdf8" font-weight="600">AI ENGINEERING COLLABORATOR</text>
  </g>

  <!-- Col 3: Open Source References -->
  <g transform="translate(800, 265)">
    <text x="0" y="15" class="footer-label">🤝 Inspirações &amp; Referências GitHub</text>
    <rect x="0" y="28" width="340" height="85" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5"/>
    <text x="20" y="55" font-family="sans-serif" font-size="12px" fill="#f1f5f9" font-weight="600">• FButros / DownloadsOrganiser</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12px" fill="#f1f5f9" font-weight="600">• unintended / download-organizer</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12px" fill="#f1f5f9" font-weight="600">• Chromium Downloads API Standard</text>
  </g>
</svg>
